<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link your Degen Walkie</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; place-items: start center; padding: 24px 16px; }
  .wrap { width: min(460px, 100%); }
  .brand { display: block; margin-bottom: 18px; }
  .net { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 5px; margin-left: 8px; }
  .net.TESTNET { color: var(--warn); border: 1px solid var(--warn); }
  .net.MAINNET { color: #fff; background: var(--bad); }
  #go { width: 100%; margin-top: 6px; }
  .hint { font-size: 13px; color: var(--mute); line-height: 1.5; }
  .done { border: 1px solid var(--neon); border-radius: 8px; padding: 12px 14px; margin: 4px 0 12px; }
  .done b { display: block; color: var(--neon); font-size: 18px; margin-bottom: 4px; }
  .done span { font-size: 13.5px; color: var(--soft); line-height: 1.5; }
  #openin { margin: 6px 0 10px; }
  #openin p { font-size: 13.5px; color: var(--soft); margin: 0 0 8px; }
  #openin a { display: block; text-align: center; text-decoration: none; margin-bottom: 8px; }
  #openin a.alt { background: transparent; color: var(--neon); }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://degenwalkie.trade/"><b>DEGEN</b> <span>WALKIE</span></a>
  <div class="card">
    <h3>Approve the device key<span class="net" id="net"></span></h3>
    <div id="detail"></div>
    <div id="openin" hidden></div>
    <button id="go" class="primary">Approve with my wallet</button>
    <pre id="log" hidden></pre>
    <p class="hint" id="hint"></p>
  </div>
  <p class="hint">Your main wallet signs one message that lets this device trade. It can't withdraw or transfer anything, and you can revoke it from the venue at any time. Degen Walkie never sees your wallet's keys.</p>
</div>
<script type="module" src="link.js"></script>
</body>
</html>
